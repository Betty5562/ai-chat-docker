name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        run: python manage.py check
        env:
          GEMINI_API_KEY: dummy-test-key
          DJANGO_SECRET_KEY: dummy-test-secret
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1

      - name: Run Django tests
        run: python manage.py test
        env:
          GEMINI_API_KEY: dummy-test-key
          DJANGO_SECRET_KEY: dummy-test-secret
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/betty5562/ai-chat-docker:latest
            ghcr.io/betty5562/ai-chat-docker:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, Windows, X64]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Log in to GitHub Container Registry (Local Runner)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: Betty5562
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pull latest Docker image
        shell: powershell
        run: docker pull ghcr.io/betty5562/ai-chat-docker:latest

      - name: Deploy container locally
        shell: powershell
        run: |
          $existing = docker ps -aq --filter "name=^/ai-agent-app$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existing) {
            docker rm -f ai-agent-app
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          docker run -d `
            --name ai-agent-app `
            --restart unless-stopped `
            -p 8000:8000 `
            --volume inventory_data:/app/data `
            --env DATABASE_PATH=/app/data/db.sqlite3 `
            --env "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" `
            --env "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" `
            --env DEBUG=False `
            --env ALLOWED_HOSTS=localhost,127.0.0.1 `
            ghcr.io/betty5562/ai-chat-docker:latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
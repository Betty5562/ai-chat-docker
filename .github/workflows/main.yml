
name: Inventory AI Agent CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'chat/**'
      - 'config/**'
      - 'manage.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/main.yml'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Django Application
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: dummy-test-key
      DJANGO_SECRET_KEY: dummy-test-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: Betty5562
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pull image on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: docker pull --platform linux/amd64 ghcr.io/betty5562/ai-chat-docker:latest
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/betty5562/ai-chat-docker:latest
            ghcr.io/betty5562/ai-chat-docker:${{ github.sha }}

  deploy:
    name: Deploy to Local Docker
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        shell: powershell
        run: |
          "$env:GHCR_TOKEN" | docker login ghcr.io --username "$env:GHCR_USERNAME" --password-stdin

      - name: Pull latest Docker image
        shell: powershell
        run: |
          docker pull ghcr.io/betty5562/ai-chat-docker:latest
          if ($LASTEXITCODE -ne 0) {
            throw "Could not pull the Docker image."
          }

      - name: Replace running container
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GEMINI_API_KEY)) {
            throw "GEMINI_API_KEY secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:DJANGO_SECRET_KEY)) {
            throw "DJANGO_SECRET_KEY secret is missing."
          }

          $existing = docker ps -aq --filter "name=^/ai-agent-app$"

          if ($LASTEXITCODE -ne 0) {
            throw "Could not check existing containers."
          }

          if ($existing) {
            docker rm -f ai-agent-app

            if ($LASTEXITCODE -ne 0) {
              throw "Could not remove the previous container."
            }
          }

          docker run -d `
            --name ai-agent-app `
            --restart unless-stopped `
            -p 8000:8000 `
            --volume inventory_data:/app/data `
            --env DATABASE_PATH=/app/data/db.sqlite3 `
            --env "GEMINI_API_KEY=$env:GEMINI_API_KEY" `
            --env "DJANGO_SECRET_KEY=$env:DJANGO_SECRET_KEY" `
            --env DEBUG=False `
            --env ALLOWED_HOSTS=localhost,127.0.0.1 `
            ghcr.io/betty5562/ai-chat-docker:latest

          if ($LASTEXITCODE -ne 0) {
            throw "Docker container failed to start."
          }

      - name: Verify deployment
        shell: powershell
        run: |
          Start-Sleep -Seconds 10
          docker ps --filter "name=ai-agent-app"

          if ($LASTEXITCODE -ne 0) {
            throw "Could not verify the deployment."
          }

          docker logs --tail 30 ai-agent-app

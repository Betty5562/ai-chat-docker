
name: Inventory AI Agent CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'chat/**'
      - 'config/**'
      - 'manage.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/main.yml'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Django Application
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: dummy-test-key
      DJANGO_SECRET_KEY: dummy-test-secret
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/betty5562/ai-chat-docker:latest
            ghcr.io/betty5562/ai-chat-docker:${{ github.sha }}
